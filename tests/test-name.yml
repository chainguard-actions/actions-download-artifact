name: Test download artifact by name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@v4

      # Create a fake artifact directory to simulate a previously uploaded artifact
      - name: Setup fake artifact in workspace
        run: |
          mkdir -p /tmp/fake-artifact
          echo "hello from artifact" > /tmp/fake-artifact/hello.txt

      - id: action
        uses: .
        with:
          name: my-named-artifact
          path: /tmp/download-by-name
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran (name input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because no real artifact named 'my-named-artifact' exists,
          # but we verify the action was invoked with the name input (not a config error).
          # A "No artifacts found" error is expected and acceptable here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted the name input and ran"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
