name: Test basic download-artifact (no artifacts)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a temp download directory
        run: mkdir -p /tmp/artifact-download

      - id: action
        name: Run download-artifact action
        uses: .
        with:
          path: /tmp/artifact-download
          pattern: 'nonexistent-artifact-*'
          merge-multiple: 'false'
        continue-on-error: true

      - name: Assert download-path output is set or action ran
        env:
          DOWNLOAD_PATH: ${{ steps.action.outputs.download-path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "download-path: $DOWNLOAD_PATH"
          # The action either succeeds (no artifacts found is ok) or fails with API error
          # In act environment without real GitHub API, we expect it to fail gracefully
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in act environment without real artifacts)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
