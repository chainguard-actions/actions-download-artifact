name: Test download-artifact merge-multiple option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: download
        uses: .
        with:
          pattern: 'nonexistent-merge-*'
          path: /tmp/artifact-merge-output
          merge-multiple: 'true'
        continue-on-error: true

      - name: Assert action outcome with merge-multiple enabled
        env:
          OUTCOME: ${{ steps.download.outcome }}
          DOWNLOAD_PATH: ${{ steps.download.outputs.download-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "download-path: $DOWNLOAD_PATH"
          # When no artifacts match the pattern, the action may succeed with empty
          # results or fail. Either is acceptable behavior.
          # The key assertion is that merge-multiple input is accepted without error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome=$OUTCOME (merge-multiple input accepted)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
