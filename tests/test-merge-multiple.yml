name: Test merge-multiple behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with merge-multiple=false (default): artifacts go into named subdirectories
      - id: action-no-merge
        uses: .
        continue-on-error: true
        with:
          path: /tmp/artifacts-no-merge
          merge-multiple: 'false'

      - name: Assert no-merge action ran gracefully
        env:
          OUTCOME: ${{ steps.action-no-merge.outcome }}
          DOWNLOAD_PATH: ${{ steps.action-no-merge.outputs.download-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "download-path: $DOWNLOAD_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_PATH" ]; then
              echo "FAIL: action succeeded but download-path output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with download-path='$DOWNLOAD_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Test with merge-multiple=true: all artifacts go into the same directory
      - id: action-merge
        uses: .
        continue-on-error: true
        with:
          path: /tmp/artifacts-merge
          merge-multiple: 'true'

      - name: Assert merge action ran gracefully
        env:
          OUTCOME: ${{ steps.action-merge.outcome }}
          DOWNLOAD_PATH: ${{ steps.action-merge.outputs.download-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "download-path: $DOWNLOAD_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_PATH" ]; then
              echo "FAIL: action succeeded but download-path output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with download-path='$DOWNLOAD_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
