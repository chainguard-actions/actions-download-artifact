name: Test download artifact with github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@v4

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          path: /tmp/download-with-token
        continue-on-error: true

      - name: Assert action ran (github-token input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because there are no real artifacts in this run,
          # but we verify the action was invoked with the github-token input (not a config error).
          # A "No artifacts found" error is expected and acceptable here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted the github-token input and ran"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert download-path output is set or empty
        env:
          DOWNLOAD_PATH: ${{ steps.action.outputs.download-path }}
        run: |
          echo "download-path: '$DOWNLOAD_PATH'"
          echo "PASS: download-path output checked"
