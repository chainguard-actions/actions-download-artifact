name: Test github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/github-token-test

      - name: Assert action ran (github-token input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOWNLOAD_PATH: ${{ steps.action.outputs.download-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "download-path: $DOWNLOAD_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_PATH" ]; then
              echo "FAIL: action succeeded but download-path output is empty"
              exit 1
            fi
            echo "PASS: artifact downloaded to $DOWNLOAD_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo has no artifacts to download)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
