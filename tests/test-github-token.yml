name: Test github-token input
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create artifact content
        run: |
          mkdir -p /tmp/token-artifact
          echo "token-test-content" > /tmp/token-artifact/token-file.txt
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: token-test-artifact
          path: /tmp/token-artifact/

  test:
    runs-on: ubuntu-latest
    needs: upload
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: download
        uses: .
        with:
          name: token-test-artifact
          path: /tmp/token-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Assert download-path output
        env:
          ACTUAL: ${{ steps.download.outputs.download-path }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: download-path output is empty"
            exit 1
          fi
          echo "PASS: download-path=$ACTUAL"
      - name: Assert artifact file exists
        run: |
          if [ ! -f "/tmp/token-download/token-file.txt" ]; then
            echo "FAIL: expected file not found at /tmp/token-download/token-file.txt"
            ls -la /tmp/token-download/ || true
            exit 1
          fi
          CONTENT=$(cat /tmp/token-download/token-file.txt)
          echo "content: $CONTENT"
          if [ "$CONTENT" != "token-test-content" ]; then
            echo "FAIL: unexpected content: $CONTENT"
            exit 1
          fi
          echo "PASS"
