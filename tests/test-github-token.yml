name: Test download-artifact with github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: download
        uses: .
        with:
          name: nonexistent-artifact-for-token-test
          path: /tmp/github-token-download
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran with github-token input
        env:
          DOWNLOAD_PATH: ${{ steps.download.outputs.download-path }}
          OUTCOME: ${{ steps.download.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "download-path: $DOWNLOAD_PATH"
          # The action uses the real GitHub token to authenticate with the API.
          # The artifact does not exist in this run, so the action is expected
          # to fail with "artifact not found" rather than "bad credentials".
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_PATH" ]; then
              echo "FAIL: action succeeded but download-path output is empty"
              exit 1
            fi
            echo "PASS: artifact downloaded to $DOWNLOAD_PATH"
          else
            # Expected: artifact not found, but token was accepted (no auth error)
            echo "INFO: artifact not found (expected under act), outcome=$OUTCOME"
            echo "PASS: action correctly used github-token and failed gracefully for missing artifact"
          fi
