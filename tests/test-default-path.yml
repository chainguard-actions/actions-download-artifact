name: Test download-artifact default path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run download-artifact with no path (defaults to GITHUB_WORKSPACE)
        uses: .
        with:
          pattern: 'nonexistent-artifact-xyz'
          merge-multiple: 'false'
        continue-on-error: true

      - name: Assert action ran (success or expected failure)
        env:
          DOWNLOAD_PATH: ${{ steps.action.outputs.download-path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "download-path: $DOWNLOAD_PATH"
          # In act without real GitHub API, the action may fail to connect
          # We just verify it ran (not skipped) and produced a recognizable outcome
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
