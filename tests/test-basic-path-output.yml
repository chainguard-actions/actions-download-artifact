name: Test download-artifact basic path output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: download
        uses: .
        with:
          path: /tmp/my-artifacts
        continue-on-error: true

      - name: Assert download-path output is set
        env:
          DOWNLOAD_PATH: ${{ steps.download.outputs.download-path }}
          OUTCOME: ${{ steps.download.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "download-path: $DOWNLOAD_PATH"
          # If the action succeeded, the download-path should match the specified path
          if [ "$OUTCOME" = "success" ]; then
            if [ "$DOWNLOAD_PATH" != "/tmp/my-artifacts" ]; then
              echo "FAIL: expected download-path '/tmp/my-artifacts' but got '$DOWNLOAD_PATH'"
              exit 1
            fi
            echo "PASS: download-path matches specified path"
          else
            # No artifacts in this run — expected under act; just verify the action ran
            echo "INFO: action did not succeed (likely no artifacts in this run), outcome=$OUTCOME"
            echo "PASS: action ran and handled missing artifacts gracefully"
          fi
