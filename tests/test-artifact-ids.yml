name: Test download-artifact with artifact-ids input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: download
        uses: .
        with:
          artifact-ids: '123456789'
          path: /tmp/artifact-ids-download
        continue-on-error: true

      - name: Assert action ran with artifact-ids input
        env:
          DOWNLOAD_PATH: ${{ steps.download.outputs.download-path }}
          OUTCOME: ${{ steps.download.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "download-path: $DOWNLOAD_PATH"
          # Under act there are no real uploaded artifacts, so the action is
          # expected to fail when trying to fetch artifact ID 123456789.
          # We verify it either succeeded (unlikely) or failed gracefully.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DOWNLOAD_PATH" ]; then
              echo "FAIL: action succeeded but download-path output is empty"
              exit 1
            fi
            echo "PASS: artifact downloaded to $DOWNLOAD_PATH"
          else
            # Expected: artifact ID not found via GitHub API in act environment
            echo "INFO: artifact-ids not found (expected under act), outcome=$OUTCOME"
            echo "PASS: action correctly reported failure for unknown artifact-ids"
          fi
