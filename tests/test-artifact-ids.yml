name: Test download artifact by artifact-ids
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@v4

      - id: action
        uses: .
        with:
          artifact-ids: '123456789'
          path: /tmp/download-by-id
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran (artifact-ids input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because artifact ID 123456789 does not exist,
          # but we verify the action was invoked with the artifact-ids input (not a config error).
          # A "No artifacts found" or "not found" error is expected and acceptable here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted the artifact-ids input and ran"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
