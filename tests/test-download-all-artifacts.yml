name: Test download all artifacts (no name specified)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt to download all artifacts (no name input)
        id: action
        uses: .
        with:
          path: /tmp/all-artifacts-output
        continue-on-error: true

      - name: Assert action completed without crashing the runner
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act there is no artifact service; the action may fail or succeed
          # with 0 artifacts. Either way the runner must not crash.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
