name: Test download-artifact with custom path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run download-artifact with custom path
        id: download
        uses: .
        with:
          path: /tmp/my-custom-artifacts
        continue-on-error: true

      - name: Assert download-path reflects custom path when action succeeds
        env:
          OUTCOME: ${{ steps.download.outcome }}
          DOWNLOAD_PATH: ${{ steps.download.outputs.download-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "download-path: $DOWNLOAD_PATH"
          if [ "$OUTCOME" = "success" ]; then
            # download-path should be under or equal to the specified path
            if [ -z "$DOWNLOAD_PATH" ]; then
              echo "FAIL: action succeeded but download-path is empty"
              exit 1
            fi
            echo "PASS: download-path='$DOWNLOAD_PATH'"
          else
            echo "INFO: action did not succeed (outcome=$OUTCOME) — expected in act without real artifacts"
            echo "PASS: graceful failure confirmed"
          fi
