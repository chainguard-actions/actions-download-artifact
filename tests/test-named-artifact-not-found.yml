name: Test named artifact not found error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt to download a named artifact (expected to fail gracefully)
        id: action
        uses: .
        with:
          name: my-test-artifact
          path: /tmp/artifact-output
        continue-on-error: true

      - name: Assert action failed gracefully (no artifact service in act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act there is no artifact service, so the download should fail.
          # We assert the action either failed or succeeded (not crashed the runner).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (no runner crash)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
