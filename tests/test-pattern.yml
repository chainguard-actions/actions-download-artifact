name: Test download-artifact pattern input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: download
        uses: .
        with:
          path: /tmp/pattern-artifacts
          pattern: 'my-artifact-*'
        continue-on-error: true

      - name: Assert action ran with pattern input
        env:
          DOWNLOAD_PATH: ${{ steps.download.outputs.download-path }}
          OUTCOME: ${{ steps.download.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "download-path: $DOWNLOAD_PATH"
          # The action should either succeed or fail gracefully (no artifacts in act run)
          if [ "$OUTCOME" = "success" ]; then
            if [ "$DOWNLOAD_PATH" != "/tmp/pattern-artifacts" ]; then
              echo "FAIL: expected download-path '/tmp/pattern-artifacts' but got '$DOWNLOAD_PATH'"
              exit 1
            fi
            echo "PASS: download-path matches specified path with pattern input"
          else
            echo "INFO: action did not succeed (likely no artifacts in this run), outcome=$OUTCOME"
            echo "PASS: action ran and handled missing artifacts gracefully with pattern input"
          fi
