name: Test download-artifact skip-decompress option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: download
        uses: .
        with:
          name: nonexistent-artifact-skip-decompress
          path: /tmp/artifact-skip-decompress
          skip-decompress: 'true'
        continue-on-error: true

      - name: Assert action fails when artifact not found (skip-decompress mode)
        env:
          OUTCOME: ${{ steps.download.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the artifact doesn't exist
          # This confirms skip-decompress input is accepted and the action runs
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when artifact does not exist, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when named artifact does not exist (skip-decompress=true)"
